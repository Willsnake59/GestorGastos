<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Circle Gradient matching the Header Logo Badge -->
    <linearGradient id="badgeBg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1c1d24" />
      <stop offset="100%" stop-color="#0c0d11" />
    </linearGradient>

    <!-- Subtle Golden Border Highlight -->
    <linearGradient id="rimStroke" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ae9357" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#2e3038" />
      <stop offset="100%" stop-color="#1c1d22" />
    </linearGradient>

    <!-- Rich Gilded Gold Stroke for Wallet -->
    <linearGradient id="walletGold" x1="6" y1="20" x2="20" y2="4" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ae9357" />
      <stop offset="50%" stop-color="#fff0cc" />
      <stop offset="100%" stop-color="#ae9357" />
    </linearGradient>
  </defs>

  <!-- Circular Base Badge (identical to the header badge) -->
  <circle cx="256" cy="256" r="236" fill="url(#badgeBg)" stroke="url(#rimStroke)" stroke-width="22" />

  <!-- Subtle golden core glow -->
  <circle cx="256" cy="256" r="140" fill="#ae9357" opacity="0.12" />

  <!-- The Exact Golden Wallet Icon from Header, scaled to 512x512 -->
  <g transform="translate(106, 106) scale(12.5)" fill="none" stroke="url(#walletGold)" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
    <path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1" />
    <path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4" />
  </g>
</svg>